name: Update Drone No-Fly Zones

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  update-zones:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update zones
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ae100eae98e9ab0b6b8494b14e0059af
        run: node scripts/update-zones.cjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zones.json || true
          git commit -m "chore: update zones data [skip ci]" || echo "No changes"
          git push || echo "Nothing to push"
